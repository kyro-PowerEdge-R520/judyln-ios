# devices/judyln/device.conf: LG G7 ThinQ (judyln, SDM845) configuration and status.

device judyln
	title       LG G7 ThinQ
	vendor      LG
	soc         sdm845
	defconfig   judyln_defconfig
	firmware    pull-firmware.sh
	maintainer  Antigravity
	status      display     works     1440x3120 MLCD+ IPS panel via UEFI framebuffer (0x9d400000)
	status      touch       partial   LG SW494xx / Synaptics S3707 on SPI @ 0x894000, TLMM GPIO 31/32
	status      buttons     works     PM8998 PON (Power, VolDown) + PMIC GPIO 6 (VolUp) + TLMM GPIO 89 (ThinQ key)
	status      cpu         works     all 8 cores (4x Kryo 385 Gold @ 2.8 GHz, 4x Kryo 385 Silver @ 1.7 GHz)
	status      gpu         partial   Adreno 630 (chip ID 0x06030001) hakios-metal / Mesa Turnip
	status      storage     works     UFS 2.1 (ufsroot0)
	status      wifi        partial   WCN3990 via ath10k / snoc
	status      battery     partial   PM8998 / SMB1355 fuel gauge
